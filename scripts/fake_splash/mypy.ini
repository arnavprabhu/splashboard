# Type-check the fake engine: `uvx mypy --config-file scripts/fake_splash/mypy.ini`
# from the repository root. Files copied verbatim from ./splash are untyped
# upstream and stay byte-identical, so they are followed but not reported.
[mypy]
python_version = 3.12
mypy_path = scripts/fake_splash/pkg:scripts/fake_splash:scripts/fake_splash/tests
files = scripts/fake_splash/harness.py, scripts/fake_splash/hub.py, scripts/fake_splash/pkg/install, scripts/fake_splash/pkg/server, scripts/fake_splash/tests
explicit_package_bases = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
no_implicit_optional = True
strict_equality = True

[mypy-server.serve_options,server.origins,server.http_security,server.errors,server.images,server.metrics,server.latency,server.json_codec,server.lru,server.diagnostics,install.families]
ignore_errors = True
