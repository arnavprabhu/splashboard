<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Splash GUI</title>
    <link rel="preload" href="/src/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Apply the stored theme before first paint (SPEC §18.1). Keep the key in sync with src/store/theme.ts. -->
    <script>
      (function () {
        var t = 'light';
        try {
          var s = localStorage.getItem('splash-gui-theme');
          if (s === 'light' || s === 'dark' || s === 'system') t = s;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
