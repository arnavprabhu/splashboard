<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Splashboard</title>
    <link rel="preload" href="/src/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Apply the stored theme before first paint. Keep the key in sync with src/store/theme.ts.
         Without a stored choice, the menu bar app's `?theme=light|dark` is used. -->
    <script>
      (function () {
        var t = 'light';
        var s = null;
        try {
          s = localStorage.getItem('splash-gui-theme');
        } catch (e) {}
        if (s === 'light' || s === 'dark' || s === 'system') t = s;
        else {
          var q = /[?&]theme=(light|dark)(?:&|$)/.exec(location.search);
          if (q) t = q[1];
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
