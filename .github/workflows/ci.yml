# CI for Splashboard. Four jobs run in parallel, so a run takes as long as the slowest one:
#   checks      ubuntu-latest: ruff, mypy (--platform darwin), typecheck, vitest, build, bundle size.
#   pytest      macos-26: manager and fake-engine pytest, one worker per core.
#   playwright  macos-26: the web admin against stubbed routes and a real manager.
#   swift       macos-26: swift build and test, with the build folder cached.
# Nothing here needs a model, Metal or the network beyond package installs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repository.
permissions:
  contents: read

env:
  # Never touch a developer's ~/.splash; every job uses a throwaway base directory.
  SPLASH_GUI_SECRETS: memory
  FORCE_COLOR: '1'

jobs:
  checks:
    name: checks (ruff · mypy · typecheck · vitest · build · size)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: manager/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: manager ruff
        working-directory: manager
        run: uv sync --locked && uv run ruff check . && uv run ruff format --check .
      - name: manager mypy (as on macOS)
        working-directory: manager
        run: uv run mypy --platform darwin
      - name: fake engine ruff
        run: uvx ruff check scripts/fake_splash && uvx ruff format --check scripts/fake_splash
      - name: fake engine mypy (as on macOS)
        run: uvx --with pytest mypy --config-file scripts/fake_splash/mypy.ini --platform darwin
      - name: web install, typecheck, vitest, build, size
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test && pnpm build && pnpm size

  pytest:
    name: macOS pytest (manager · fake engine)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: manager/uv.lock
      - name: manager pytest
        working-directory: manager
        # One worker per core (pytest-xdist). A test over 5 minutes fails with its stack
        # (pytest-timeout) instead of using up the job. A few tests measure restart and
        # backoff timing, which a loaded 3-core runner can miss, so a failure is retried
        # twice (pytest-rerunfailures); reruns are listed in the summary.
        run: >-
          uv sync --locked && SPLASH_GUI_HOME="$RUNNER_TEMP/splash-home"
          uv run pytest -n auto --timeout=300 --reruns 2 -rR --durations=15
      - name: fake engine pytest
        run: uv run --no-project --with pytest pytest scripts/fake_splash/tests

  playwright:
    name: macOS Playwright (stubbed shell + real manager)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: manager/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: manager environment
        working-directory: manager
        run: uv sync --locked
      - name: web build
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install chromium
      - name: playwright
        working-directory: web
        run: pnpm exec playwright test
      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  swift:
    name: macOS Swift (build · test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: SwiftPM cache
        uses: actions/cache@v4
        with:
          path: macos/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('macos/Package.resolved', 'macos/Package.swift') }}
      - name: swift build and test
        working-directory: macos
        run: swift --version && swift build && swift test
