[project]
name = "splash-gui"
version = "0.1.0"
description = "Splash GUI manager: supervises the Splash engine, proxies its API and serves the web admin."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Splash GUI contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "huggingface_hub>=0.26",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "anyio>=4.6",
    "tomlkit>=0.15.1",
]

[project.scripts]
splash-gui-manager = "splash_gui.manager:main"
splash = "splash_gui.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["splash_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Real-engine contract tests need the installed Splash and the network, so they
# are excluded here; `make test-real` passes `-m real`, which overrides this.
addopts = "-q -m 'not real'"
markers = [
    "real: contract tests against the installed Homebrew Splash and the live Hub (make test-real)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PTH", "TID", "S"]
ignore = [
    "TID252",  # relative imports within the package are the house style
    "S101",  # assert is fine in tests and for type narrowing
    "S603",  # subprocess calls are deliberate and never use a shell
    "S607",  # partial executable paths (brew, security) are resolved from PATH on purpose
    "RUF001", "RUF002", "RUF003",  # typographic characters in user-facing strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S310"]
"splash_gui/helpers/**" = ["PTH"]
# Queries are composed from fixed column names; every value is a ? parameter.
"splash_gui/usage/db.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["splash_gui", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
